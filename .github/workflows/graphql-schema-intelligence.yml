# Analyzes GraphQL schema changes and reports which client operations they affect.
#
# Informational only: breaking schema changes are reported (job summary, annotation, artifact)
# but never fail the workflow. Build, test and analysis errors (e.g. an invalid schema) do fail it.
#
# The workflow only prepares inputs and invokes the CLI; all analysis lives in the C# application.

name: GraphQL Schema Intelligence

on:
  pull_request:
    paths:
      - '**/*.graphql'
      - '**/*.graphqls'
      - '**/*.gql'
      - 'src/**'
      - 'demo/**'
      - 'Veel.GraphQL.SchemaIntelligence.sln'
      - 'nuget.config'
      - '.github/workflows/graphql-schema-intelligence.yml'
  push:
    branches: [main]
    paths:
      - '**/*.graphql'
      - '**/*.graphqls'
      - '**/*.gql'
      - 'src/**'
      - 'demo/**'
      - 'Veel.GraphQL.SchemaIntelligence.sln'
      - 'nuget.config'
      - '.github/workflows/graphql-schema-intelligence.yml'

# Read-only: checkout, build, test, job summary and artifact upload need nothing more.
permissions:
  contents: read

# A newer push to the same PR/branch supersedes a running analysis.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # The schema of record, compared between the base revision and this revision.
  # In this POC the demo file stands in for the backend schema; point it at the exported service schema later.
  SCHEMA_FILE: demo/new-schema.graphql
  ANDROID_OPERATIONS: demo/android
  FRONTEND_OPERATIONS: demo/frontend
  SERVICE_NAME: Cerberus
  REPORT_DIR: reports

jobs:
  schema-intelligence:
    name: Build, test and analyze schema
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the base revision's schema can be read without another (authenticated) fetch.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Veel.GraphQL.SchemaIntelligence.sln

      - name: Build
        run: dotnet build Veel.GraphQL.SchemaIntelligence.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Veel.GraphQL.SchemaIntelligence.sln --configuration Release --no-build

      # Input preparation only: extract the schema as it was at the base revision.
      - name: Prepare base schema
        id: base-schema
        env:
          # Pull request: the target branch commit. Push: the commit before the push.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base_schema="$RUNNER_TEMP/base-schema.graphql"
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:$SCHEMA_FILE" 2>/dev/null; then
            git show "$BASE_SHA:$SCHEMA_FILE" > "$base_schema"
            echo "Comparing $SCHEMA_FILE at base ${BASE_SHA:0:12} with this revision."
          else
            # New schema file, new branch, or unknown base: nothing to compare against.
            echo "::notice title=GraphQL schema::No base version of $SCHEMA_FILE was found; comparing the schema with itself."
            cp "$SCHEMA_FILE" "$base_schema"
          fi
          echo "path=$base_schema" >> "$GITHUB_OUTPUT"

      # Same command developers run locally. Exit code is non-zero only when analysis itself fails.
      # No webhook settings are provided here, so no notification is sent from CI.
      - name: Analyze schema changes
        env:
          BASE_SCHEMA: ${{ steps.base-schema.outputs.path }}
        run: |
          # Remove committed example reports so only freshly generated output can be published.
          rm -f "$REPORT_DIR/schema-change-report.md" "$REPORT_DIR/schema-change-report.json"
          dotnet run --project src/Veel.GraphQL.SchemaIntelligence --configuration Release --no-build -- \
            analyze \
            --old-schema "$BASE_SCHEMA" \
            --new-schema "$SCHEMA_FILE" \
            --android "$ANDROID_OPERATIONS" \
            --frontend "$FRONTEND_OPERATIONS" \
            --service "$SERVICE_NAME" \
            --output "$REPORT_DIR"

      - name: Publish report to job summary
        if: ${{ !cancelled() && hashFiles('reports/schema-change-report.md') != '' }}
        run: cat "$REPORT_DIR/schema-change-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: graphql-schema-change-report
          path: |
            reports/schema-change-report.md
            reports/schema-change-report.json
          if-no-files-found: warn
          retention-days: 14
